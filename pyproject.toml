[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localrag"
description = "A fully local retrieval-augmented generation pipeline, built eval-first."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["version"]

# Runtime deps stay pinned in requirements.txt so the local model stack does not
# drift; this package is installed with `pip install -e .` on top of them.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "localrag.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
